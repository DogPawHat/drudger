name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build release binaries
        run: |
          mkdir -p dist
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64; do
            output="dist/drudger-${target#bun-}"
            bun build ./src/cli.ts --compile --target="$target" --outfile "$output"
            chmod +x "$output"
          done

      - name: Smoke test linux binary
        run: dist/drudger-linux-x64 --help

      - name: Generate checksums
        run: sha256sum dist/drudger-* > dist/sha256sums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/drudger-linux-x64
            dist/drudger-linux-arm64
            dist/drudger-darwin-x64
            dist/drudger-darwin-arm64
            dist/sha256sums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
